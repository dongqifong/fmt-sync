name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Ruff
        run: python -m pip install ruff==0.17.3

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Biome
        run: npm install --prefix .scratch/ci-biome --no-save --package-lock=false @biomejs/biome@2.6.4

      - name: Add native Biome executable to PATH
        run: >-
          node -e "const fs = require('node:fs');
          const path = require('node:path');
          const dir = path.resolve('.scratch/ci-biome/node_modules/@biomejs', 'cli-' + process.platform + '-' + process.arch);
          fs.accessSync(path.join(dir, process.platform === 'win32' ? 'biome.exe' : 'biome'));
          fs.appendFileSync(process.env.GITHUB_PATH, dir + '\n');"

      - name: Run all tests, including native tools and real Cargo updates
        run: cargo test --locked --all-targets -- --include-ignored
